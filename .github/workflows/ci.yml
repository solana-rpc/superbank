name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SUPERBANK_GIT_SHA: ${{ github.sha }}

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install libclang (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev pkg-config libudev-dev libusb-1.0-0-dev

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: ci-lint

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo clippy optional features (superbank-rpc)
        run: cargo clippy -p superbank-rpc --all-targets --all-features --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: 1.98.1

      - name: Install libclang (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev pkg-config libudev-dev libusb-1.0-0-dev

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: ci-test

      - name: cargo test
        run: cargo test --workspace --locked

      - name: Check standalone gRPC streaming feature
        run: cargo check -p superbank-rpc --no-default-features --features grpc-streaming --locked

      - name: Test optional features (superbank-rpc)
        run: cargo test -p superbank-rpc --all-features --locked

      - name: Test final HTTP status logs in isolation
        run: cargo test -p superbank-rpc --all-features --locked http_response_logs_match_final_status -- --ignored --test-threads=1

  test-jetstreamer-plugin:
    name: Test Jetstreamer plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Install libclang (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev pkg-config libudev-dev libusb-1.0-0-dev

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: ci-jetstreamer-plugin
          workspaces: ingest/jetstreamer-clickhouse-plugin

      - name: cargo clippy
        working-directory: ingest/jetstreamer-clickhouse-plugin
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: ingest/jetstreamer-clickhouse-plugin
        run: cargo test --locked

  # Catches main falling behind a release: a v<version> tag newer than the
  # workspace version in Cargo.toml (see scripts/release/version.py).
  version:
    name: Version matches releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Test the version script
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'

      - name: Workspace version is not behind a release tag
        run: python3 scripts/release/version.py check
