name: Dependency Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # We currently allow advisories which are informational/policy-level (e.g. "unmaintained")
          # or come from upstream dependency chains that we are not ready to refactor.
          # RUSTSEC-2026-0097 is inherited from upstream rand 0.8/0.9 dependency chains.
          # RUSTSEC-2026-0194/RUSTSEC-2026-0195 are quick-xml 0.39 DoS/perf issues reached only
          # through the locked parquet 59.0.0 -> object_store 0.13.2 -> quick-xml 0.39.4 chain.
          # Reassess these exclusions when updating that dependency chain.
          ignore: RUSTSEC-2024-0375,RUSTSEC-2025-0012,RUSTSEC-2025-0141,RUSTSEC-2024-0388,RUSTSEC-2024-0384,RUSTSEC-2024-0436,RUSTSEC-2025-0134,RUSTSEC-2021-0145,RUSTSEC-2026-0097,RUSTSEC-2026-0194,RUSTSEC-2026-0195
