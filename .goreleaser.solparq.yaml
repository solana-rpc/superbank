# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

git:
  ignore_tags:
    - "v[0-9]*.[0-9]*.[0-9]"
    - "solparq-v*"
    - "v*-solparq"

builds:
  - id: superbank-solparq
    builder: rust
    command: zigbuild
    binary: superbank-solparq
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    flags:
      - --release
      - --locked
      - --package=superbank-solparq
      - --bin=superbank-solparq
    env:
      - SUPERBANK_GIT_SHA={{ .Commit }}
  - id: superbank-solparq-read
    builder: rust
    command: zigbuild
    binary: superbank-solparq-read
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    flags:
      - --release
      - --locked
      - --package=superbank-solparq-read
      - --bin=superbank-solparq-read
    env:
      - SUPERBANK_GIT_SHA={{ .Commit }}

archives:
  - id: superbank-solparq
    ids: [superbank-solparq]
    name_template: superbank-solparq-{{ trimsuffix .Tag "-superbank-solparq" }}-{{ .Os }}-{{ .Arch }}
    formats: [tar.gz]
    files: []
  - id: superbank-solparq-read
    ids: [superbank-solparq-read]
    name_template: superbank-solparq-read-{{ trimsuffix .Tag "-superbank-solparq" }}-{{ .Os }}-{{ .Arch }}
    formats: [tar.gz]
    files: []

checksum:
  name_template: superbank-solparq-{{ trimsuffix .Tag "-superbank-solparq" }}-SHA256SUMS.txt

release:
  name_template: 'superbank-solparq {{ trimsuffix .Tag "-superbank-solparq" }}'
  header: |
    rust {{ .Env.RUST_VERSION }}

changelog:
  sort: asc
  use: github
