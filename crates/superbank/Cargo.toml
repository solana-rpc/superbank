[package]
name = "superbank"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
blake3 = "1.5.5"
bs58 = "0.5"
base64 = "0.22.1"
clickhouse = { version = "0.15" }
clap.workspace = true
futures = "0.3"
hex = "0.4"
object_store.workspace = true
once_cell = "1.21.3"
# Keep transitive OpenSSL users cross-compilable with cargo-zigbuild.
openssl = { version = "0.10", features = ["vendored"] }
prometheus-client.workspace = true
prometheus-client-derive-encode.workspace = true
kubert-prometheus-process.workspace = true
prost = "0.14.3"
prost-types = "0.14.3"
serde.workspace = true
serde-big-array = "0.5"
serde_bytes = "0.11"
serde_json.workspace = true
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["stream"] }
solana-commitment-config = "3.0.0"
solana-message = { version = "5.0.0", features = ["serde", "wincode"] }
solana-rpc-client = "=4.4.0-beta.0"
solana-rpc-client-api = "=4.4.0-beta.0"
solana-rpc-client-types = "=4.4.0-beta.0"
solana-storage-bigtable = { version = "=4.4.0-beta.0", features = ["agave-unstable-api"] }
solana-signature = "3.4.0"
solana-transaction = { version = "5.0.0", features = ["serde", "wincode"] }
solana-transaction-error = { version = "4.1.0", features = ["serde", "wincode"] }
solana-transaction-status = "=4.4.0-beta.0"
solana-transaction-status-client-types = "=4.4.0-beta.0"
superbank-solparq = { path = "../superbank-solparq" }
tokio.workspace = true
tokio-util.workspace = true
tonic = "0.14.3"
tracing.workspace = true
tracing-subscriber.workspace = true
yellowstone-fumarole-client = "0.9.0"
yellowstone-grpc-client = "15.0.0"
yellowstone-grpc-proto = "14.0.1"
wincode = "0.6.2"

[dev-dependencies]
solana-storage-proto = { version = "=4.4.0-beta.0", features = ["agave-unstable-api"] }
solana-address = "1.1.0"
solana-hash = "4.3.0"
tokio = { workspace = true, features = ["test-util"] }
