[package]
name = "superbank-solparq"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
arrow-array = "59.0.0"
arrow-json = "59.0.0"
arrow-schema = "59.0.0"
axum.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap.workspace = true
futures-util = "0.3"
object_store.workspace = true
parquet = { version = "59.0.0", features = ["arrow", "async", "object_store"] }
prometheus-client.workspace = true
prometheus-client-derive-encode.workspace = true
kubert-prometheus-process.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror = "2.0"
tokio.workspace = true
tokio-util.workspace = true
tower-http = { version = "0.6", features = ["cors"] }
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "superbank-solparq"
path = "src/main.rs"

# Read CLI for inspecting Parquet archives. Merged in from the former
# `superbank-solparq-read` crate; built alongside the daemon binary.
[[bin]]
name = "superbank-solparq-read"
path = "src/bin/superbank-solparq-read.rs"
