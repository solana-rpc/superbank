[package]
name = "superbank-solparq"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0"
arrow-array = "59.0.0"
arrow-json = "59.0.0"
arrow-schema = "59.0.0"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
object_store = { version = "0.13", features = ["aws"] }
parquet = { version = "59.0.0", features = ["arrow", "async", "object_store"] }
prometheus-client = "0.23"
prometheus-client-derive-encode = "0.4.2"
kubert-prometheus-process = "0.2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.46", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "superbank-solparq"
path = "src/main.rs"

# Read CLI for inspecting Parquet archives. Merged in from the former
# `superbank-solparq-read` crate; built alongside the daemon binary.
[[bin]]
name = "superbank-solparq-read"
path = "src/bin/superbank-solparq-read.rs"
