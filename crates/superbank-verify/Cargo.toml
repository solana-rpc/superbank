[package]
name = "superbank-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0"
axum = "0.8"
bs58 = "0.5"
clap = { version = "4.5.40", features = ["derive", "env"] }
clickhouse = { version = "0.14" }
kubert-prometheus-process = "0.2.3"
once_cell = "1.21.3"
prometheus-client = "0.23.1"
prometheus-client-derive-encode = "0.4.2"
rayon = "1.10"
serde = { version = "1.0.219", features = ["derive"] }
serde-big-array = "0.5"
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
solana-epoch-schedule = "3.0.0"
tokio = { version = "1.46.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
solana-entry = { version = "3.0.0", features = ["agave-unstable-api"] }
solana-hash = "3.1.0"
solana-merkle-tree = "3.0.0"
solana-message = "3.1.0"
solana-signature = "3.4.0"
solana-transaction = { version = "3.1.0", features = ["serde"] }
tempfile = "3"
