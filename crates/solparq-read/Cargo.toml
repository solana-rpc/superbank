[package]
name = "solparq-read"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0"
arrow-array = "59.0.0"
arrow-json = "59.0.0"
arrow-schema = "59.0.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
object_store = { version = "0.13.2", features = ["aws"] }
parquet = { version = "59.0.0", features = ["arrow", "async", "object_store"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.46", features = ["full"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "solparq-read"
path = "src/main.rs"
