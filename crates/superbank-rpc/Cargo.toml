[package]
name = "superbank-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Optional in-memory "head cache" fed by a Yellowstone DragonsMouth gRPC stream via
# Complete bank-tagged Yellowstone block updates. This remains non-default
# because it opens a separate live gRPC subscription.
grpc-head-cache = [
    "dep:dashmap",
    "dep:yellowstone-grpc-client",
    "dep:yellowstone-grpc-proto",
]
# Local ClickHouse cache of recent finalized slots served in place of the source
# ClickHouse cluster. It is intentionally independent from the gRPC head cache.
disk-cache = []
pyroscope = ["dep:pyroscope", "dep:pyroscope_pprofrs"]
grpc-streaming = [
    "dep:solana-storage-proto",
    "dep:async-stream",
    "dep:prost",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tonic-prost-build",
    "dep:tokio-stream",
]

[dependencies]
axum = { workspace = true, features = ["macros"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
jsonrpc-core = "18.0.0"
bincode = "1.3.3"
wincode = "0.6.1"
serde_bytes = "0.11"
serde-big-array = "0.5"
solana-commitment-config = "3.0.0"
solana-epoch-schedule = "3.0.0"
solana-genesis-config = { version = "3", features = ["serde"] }
solana-rpc-client-api = "=4.3.0"
solana-rpc-client-types = "=4.3.0"
solana-account-decoder-client-types = "=4.3.0"
solana-clock = "3.0.0"
solana-epoch-rewards-hasher = "3.1.0"
solana-address = "2.0.0"
solana-hash = "4.3.0"
solana-instruction = "3.1.0"
solana-keypair = "3.1.2"
solana-message = { version = "4.5.0", features = ["serde", "wincode"] }
solana-signature = { version = "3.4.0", features = ["rand"] }
solana-signer = "3.0.1"
solana-transaction = { version = "4.2.0", features = ["serde", "wincode"] }
solana-transaction-error = { version = "3.3.1", features = ["serde", "wincode"] }
solana-transaction-context = "=4.3.0"
solana-storage-proto = { version = "=4.3.0", features = ["agave-unstable-api"], optional = true }
solana-transaction-status = { version = "=4.3.0", features = ["agave-unstable-api"] }
thiserror = "2.0.11"
tokio.workspace = true
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "trace"] }
moka = { version = "0.12", features = ["future"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
tracing-log = "0.2.0"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "tokio", "http1"] }
once_cell = "1.20"
prometheus-client.workspace = true
prometheus-client-derive-encode.workspace = true
kubert-prometheus-process.workspace = true
clickhouse = { version = "0.15", features = ["inserter"] }
clickhouse-rs = "1.1.0-alpha.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
async-stream = { version = "0.3", optional = true }
bs58 = "0.5"
hex = "0.4"
blake3 = "1.5.5"
ch_cityhash102 = "0.1"
prost = { version = "0.14.3", optional = true }
tonic = { version = "0.14.5", optional = true }
tonic-prost = { version = "0.14.5", optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
dashmap = { version = "6.1.0", optional = true }
pyroscope = { version = "0.5.8", optional = true }
pyroscope_pprofrs = { version = "0.2.10", optional = true }
yellowstone-grpc-client = { git = "https://github.com/rpcpool/yellowstone-grpc", rev = "a8d88b17445e470f25cab6b72b8c742578e11cce", optional = true }
yellowstone-grpc-proto = { git = "https://github.com/rpcpool/yellowstone-grpc", rev = "a8d88b17445e470f25cab6b72b8c742578e11cce", optional = true }

[dev-dependencies]
base64 = "0.22"
clickhouse = { version = "0.15", features = ["test-util"] }
tempfile = "3"

[build-dependencies]
tonic-prost-build = { version = "0.14.5", optional = true }

[package.metadata.cargo-machete]
ignored = ["tonic-prost"]

[[bin]]
name = "superbank-rpc"
path = "src/main.rs"
