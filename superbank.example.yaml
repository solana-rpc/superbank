# Superbank ingestor example configuration.
# Copy to superbank.yaml and pass via --config / SUPERBANK_CONFIG.
#
# RPC cache options are CLI/env settings, not YAML fields:
# DISK_CACHE_ADDRESS_QUERY_TIMEOUT_MS=100 bounds all cache stages of one
# getSignaturesForAddress/getTransactionsForAddress request; expiry uses primary fallback.
# It is independent of DISK_CACHE_QUERY_TIMEOUT_MS=2000 for other reads/index work.
# DISK_CACHE_GET_TX_TIMEOUT_MS=1000 bounds one local getTransaction attempt before
# primary fallback (capped at DISK_CACHE_QUERY_TIMEOUT_MS).
# DISK_CACHE_GET_TX_UNKNOWN_TIMEOUT_MS=150 replaces it while the signature index is
# being rebuilt (more than 4 unknown partitions, e.g. after a restart).
#
# RPC certificate source options are CLI/env settings, not YAML fields:
# AG_GENESIS_CERT_RPC_URL=https://your-cluster-rpc.example must be a trusted
# same-cluster Agave 4.3+ endpoint supporting getAgGenesisCert (never this server).
# AG_GENESIS_CERT_RPC_TIMEOUT_MS=2000 is the total source budget, including admission;
# it must be below RPC_REQUEST_TIMEOUT_MS when a source is configured.
# AG_GENESIS_CERT_REFRESH_INTERVAL_SECS=5 caches authoritative null before migration.
# Certificates stay cached until restart; failures are cached for one second.
# Unconfigured/unsupported/unavailable evidence returns an error, never null.
#
# Optional superbank-rpc exact request filters. Pass this same file to
# superbank-rpc with --config / SUPERBANK_CONFIG. Each entry contains the
# method followed by its complete params array. Matching calls return HTTP 405
# with a JSON-RPC "Method not allowed" error and do not reach RPC handlers.
# rpc-parameter-filters:
#   - [getTransactionsForAddress, So11111111111111111111111111111111111111112]
#   - [getTransactionsForAddress, So11111111111111111111111111111111111111112, {transactionDetails: signatures}]

source: "grpc" # fumarole | grpc | rpc | bigtable | solparq

endpoint: "https://your.dragonsmouth.endpoint:443"
x-token: "your-token"
commitment: "finalized"
# Optional for gRPC source. Use '*' to start from the latest slot already in
# blocks_metadata, or 0 to start from the earliest available slot.
dragonsmouth-from-slot: 0
grpc-max-decoding-bytes: 67108864
grpc-http2-adaptive-window: false
grpc-idle-timeout-secs: 30
grpc-health-watch-enabled: true
# Bank-status events on this same subscription are required even if the extra
# slot notifications below are disabled. Scalar zero waits for optional-ID
# evidence; legacy CreatedBank/finalized status without an ID stores bank_id NULL.
# Unresolved identity holds all flushes (256 blocks / 128 MiB encoded payload).
grpc-slot-notifications: true

# Fumarole source options (required when source is "fumarole")
# fumarole-endpoint: "https://your.fumarole.endpoint:443"
# fumarole-x-token: "your-token"
# fumarole-consumer-group: "superbank-mainnet"
# fumarole-alpenglow-genesis-slot: 0 # required trusted boundary; legacy Fumarole stops after this slot
# fumarole-create-consumer-group: false
# fumarole-from-slot: 0
# fumarole-data-plane-tcp-connections: 4
# fumarole-concurrent-download-limit-per-tcp: 1 # deprecated compatibility option; values other than 1 are ignored
# fumarole-data-channel-capacity: 4096
# fumarole-memory-soft-limit-bytes: 25769803776 # 24 GiB; set 0 to disable
# fumarole-commit-interval-secs: 10
# fumarole-no-commit: false

# RPC source options (required when source is "rpc")
# rpc-url: "https://api.mainnet-beta.solana.com"
# rpc-from-slot: 0
# rpc-to-slot: 0
# rpc-slot-count: 1000
# rpc-timeout-secs: 30
# rpc-retry-backoff-ms: 500
# rpc-max-inflight: 64
# rpc-max-supported-tx-version: 1
# rpc-flush-every-slots: 500
# rpc-progress-every-slots: 100
# rpc-discovery-chunk-slots: 10000
# Fetch exactly the slots in this file (getBlock per slot, no getBlocks
# discovery). Mutually exclusive with rpc-from-slot/to-slot/slot-count and
# rpc-skip-ingested-slots.
# rpc-slot-list: "/path/to/slots.txt"
# Backfill only slots missing from ClickHouse in the [from,to] range: discovery
# subtracts slots already present in the blocks table, so getBlock is only
# called for gaps. Safe to run alongside live ingest (ReplacingMergeTree).
# rpc-skip-ingested-slots: false

# Bigtable source options (required when source is "bigtable"; set exactly one of bigtable-range or bigtable-slot-file)
# rpc-url: "https://api.mainnet-beta.solana.com" # required for epoch ranges
# bigtable-range: "1-10" # epochs (requires rpc-url), or "123:456" for slots, or "5" for epoch 5
# bigtable-slot-file: "/path/to/slots.txt" # whitespace-separated slot list; mutually exclusive with bigtable-range
# bigtable-instance: "solana-ledger"
# bigtable-app-profile: "default"
# bigtable-timeout-secs: 30
# bigtable-max-message-bytes: 67108864
# bigtable-credential-path: "/path/to/gcp-credentials.json"
# bigtable-credential-json: "" # stringified JSON (mutually exclusive with credential-path)
# bigtable-discovery-limit: 10000
# bigtable-fetch-batch-size: 500
# bigtable-fetch-concurrency: 4
# bigtable-insert-concurrency: 1
# bigtable-decode-concurrency: 8
# bigtable-progress-every-slots: 10000

# The separate superbank-solparq archiver uses CLI/env (not this YAML):
# --hourly-slot-duration-ms / SOLPARQ_HOURLY_SLOT_DURATION_MS defaults to 400
# (9000 slots per nominal hour); set 200 for a 200 ms cluster (18000 slots).
# Restore reads recorded slot bounds and does not need the cadence setting.

# solparq source options (required when source is "solparq"): restore
# superbank-solparq Parquet archive bundles back into ClickHouse. Loading is
# ClickHouse-native (s3() for S3, INSERT ... FORMAT Parquet for local) and every
# table in each bundle's manifest is restored into the configured
# clickhouse-database. Bundles whose manifest format_version is newer than this
# build understands are refused.
# solparq-archive-location: "local" # local | s3
# Local archive location:
# solparq-archive-path: "/var/lib/superbank/archives" # a bundle dir, or a dir of bundles
# S3 archive location (reuses the same env vars / names as superbank-solparq):
# solparq-archive-s3-endpoint: "https://s3.us-east-1.amazonaws.com"
# solparq-archive-s3-bucket-name: "my-bucket"
# solparq-archive-s3-bucket-path: "solana/mainnet"
# solparq-archive-s3-auth-key: "ACCESS_KEY"
# solparq-archive-s3-auth-secret-key: "SECRET_KEY"
# solparq-archive-s3-region: "us-east-1"
# Optional slot window: skips bundles outside [from,to]; also filters rows for S3.
# solparq-from-slot: 0
# solparq-to-slot: 0
# Restrict to specific archived tables (default: every table in the bundle).
# solparq-tables: "transactions,blocks_metadata"
# Raw ClickHouse SETTINGS clause appended to restore statements to bound memory.
# solparq-clickhouse-settings: ""

clickhouse-url: "http://localhost:8123"
metrics-host: "0.0.0.0"
metrics-port: 9901
# Seconds without a successful ClickHouse flush before /health returns 503. Set to 0 to disable.
# health-stale-secs: 120
# Optional static label added to all ingestor metrics, e.g. the ClickHouse cluster name.
# metrics-cluster-label: "mainnet-west"
clickhouse-database: "default"
clickhouse-user: "default"
clickhouse-password: ""
# Force synchronous inserts by default; set true only if your ClickHouse setup supports async inserts safely.
# clickhouse-async-insert: false
transactions-table: "default.transactions"
blocks-table: "default.blocks_metadata"
block-footers-table: "default.block_footers"
entries-table: "default.entries"

transactions-flush-rows: 25000
blocks-flush-rows: 2000
flush-interval-secs: 5
flush-every-block: false

# ClickHouse insert retry (stateless sources: grpc, rpc, bigtable only — fumarole is excluded)
# insert-max-retries: 5
# insert-retry-base-ms: 1000
# insert-retry-max-ms: 30000
